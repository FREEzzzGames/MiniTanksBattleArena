name: Build MiniTanksBattleArena Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Prepare offline game assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/
          cp -R css js assets android/app/src/main/assets/www/
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: android
          arguments: assembleDebug --stacktrace
      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package versioned APK ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='1.0.4'
          mkdir -p dist/minitanksbattlearena
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/minitanksbattlearena/MiniTanksBattleArena-v${VERSION}-debug.apk
          cat > dist/minitanksbattlearena/README.txt <<EOF
          MiniTanksBattleArena Android APK
          Version: ${VERSION}
          Build commit: ${GITHUB_SHA}
          Package: debug-signed APK for direct installation on Android.
          Install: download the APK, open it on the phone, and allow installs from this source if Android asks.
          The APK contains a local/offline copy of the web game assets bundled by the Android build.
          EOF
          (cd dist && zip -qr MiniTanksBattleArena-Android-v${VERSION}.zip minitanksbattlearena)
          test -s dist/MiniTanksBattleArena-Android-v${VERSION}.zip
      - name: Upload versioned APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MiniTanksBattleArena-Android-v1.0.4-ZIP
          path: dist/MiniTanksBattleArena-Android-v1.0.4.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniTanksBattleArena-Android-v1.0.4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
